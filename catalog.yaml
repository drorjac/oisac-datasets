# Open datasets for opportunistic precipitation sensing: radio links built for something else
# (cellular backhaul, community and smart-city mesh, satellite TV) and citizen weather stations.
#
# One entry per dataset.
#   source   where the files live: zenodo record, 4tu article, github folder, a page for a
#            manual download, or not open
#   sample   what `python -m oisac_datasets fetch <id>` downloads by default: a small split,
#            never the whole archive unless it is small
#   lat/lon  a point for the overview map (a list of points for multi-site sets)
#   start/end (YYYY-MM), res_s (sampling in seconds), n (sensors), for the overview figures
#
# group: main       the main networks of the OISAC lecture
#        more       other open link datasets: campaigns, single links, archives
#        products   rain maps and adjusted radar made from opportunistic sensors
#        examples   example data shipped with the processing software
#        simulated  simulations and method data
#        active     links built for the experiment (testbeds)
#        closed     known networks whose data are not open (yet)

datasets:

  # ---------------------------------------------------------------- main
  - id: openmrg
    name: OpenMRG
    group: main
    sensor: CML
    region: Gothenburg, Sweden
    period: Jun-Aug 2015
    start: 2015-06
    end: 2015-08
    resolution: 10 s
    res_s: 10
    n: 364
    lat: 57.70
    lon: 11.97
    content: 364 CMLs (728 sub-links, 7-38 GHz), TSL and RSL; 11 city gauges, SMHI gauge, SMHI radar
    licence: CC BY-SA 4.0
    operator: Ericsson
    paper: Andersson et al. (2022), ESSD 14, 5411-5426
    paper_doi: 10.5194/essd-14-5411-2022
    data_doi: 10.5281/zenodo.7107689
    source: {type: zenodo, record: "7107689"}
    sample:
      - {file: OpenMRG.zip, members: [readme.txt, cml/cml_metadata.csv, gauges/city/CityGauges-metadata.csv, gauges/smhi/GbgA-71420-2015JJA.csv]}
      - {github: OpenSenseAction/opensense_example_data, path: OpenMRG/openmrg_cml_8d.nc}
      - {github: OpenSenseAction/opensense_example_data, path: OpenMRG/openmrg_municp_gauge_8d.nc}
      - {github: OpenSenseAction/opensense_example_data, path: OpenMRG/openmrg_rad_8d.nc}
    sample_note: readme and metadata from inside the 318 MB zip (read over HTTP; the 4.6 GB cml.nc stays remote), plus the OpenSense 8-day example subset (CML, city gauges, radar)
    links:
      example data: https://github.com/OpenSenseAction/opensense_example_data/tree/main/OpenMRG
      notebook: https://github.com/OpenSenseAction/OPENSENSE_sandbox/blob/main/notebooks/openMRG_use_case.ipynb

